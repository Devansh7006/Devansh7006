name: generate animation

on:
  schedule:
    # run automatically every 24 hours at 19:00 UTC (after 3D contrib at 18:00 UTC)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # generates a snake game from a github user contributions graph and outputs svg animations
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit & Push to main
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/github-contribution-grid-snake*.svg
          git commit -m "chore: update snake animation [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push
